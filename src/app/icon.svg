<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- Background space gradient -->
        <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
            <stop offset="0%" stop-color="#1C2541"/>
            <stop offset="100%" stop-color="#0B132B"/>
        </radialGradient>
        
        <!-- Nebula glowing clouds -->
        <radialGradient id="nebula1" cx="30%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#3A506B" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#1C2541" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebula2" cx="70%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#5BC0BE" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
        </radialGradient>
        
        <!-- Gradient for the financial trend line -->
        <linearGradient id="chartLine" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5BC0BE"/>
            <stop offset="100%" stop-color="#6FFFE9"/>
        </linearGradient>
        
        <!-- Glow effect for nodes and main elements -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background Squircle -->
    <rect width="512" height="512" rx="110" fill="url(#spaceBg)"/>

    <!-- Nebula Clouds -->
    <circle cx="150" cy="380" r="250" fill="url(#nebula1)"/>
    <circle cx="380" cy="150" r="220" fill="url(#nebula2)"/>

    <!-- Stratospheric Orbits / Planetary Rings -->
    <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="#3A506B" stroke-width="3" transform="rotate(-25 256 256)" opacity="0.6"/>
    <ellipse cx="256" cy="256" rx="220" ry="80" fill="none" stroke="#1C2541" stroke-width="2" transform="rotate(45 256 256)" opacity="0.5"/>
    <ellipse cx="256" cy="256" rx="140" ry="40" fill="none" stroke="#5BC0BE" stroke-width="1.5" stroke-dasharray="8 8" transform="rotate(-15 256 256)" opacity="0.4"/>

    <!-- Financial Elements (Space-themed Bar Chart) -->
    <!-- Base bars -->
    <rect x="120" y="290" width="36" height="90" fill="#3A506B" rx="8" opacity="0.7"/>
    <rect x="195" y="230" width="36" height="150" fill="#5BC0BE" rx="8" opacity="0.8"/>
    <rect x="270" y="270" width="36" height="110" fill="#3A506B" rx="8" opacity="0.7"/>
    <!-- Highlighted glowing bar -->
    <rect x="345" y="140" width="36" height="240" fill="#6FFFE9" rx="8" filter="url(#glow-light)"/>

    <!-- Trend Line / Constellation -->
    <polyline points="90,340 138,270 213,210 288,240 363,120 430,70" fill="none" stroke="url(#chartLine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Constellation Stars / Data Nodes -->
    <circle cx="90" cy="340" r="6" fill="#6FFFE9" filter="url(#glow-light)"/>
    <circle cx="138" cy="270" r="7" fill="#6FFFE9" filter="url(#glow-light)"/>
    <circle cx="213" cy="210" r="9" fill="#6FFFE9" filter="url(#glow)"/>
    <circle cx="288" cy="240" r="7" fill="#6FFFE9" filter="url(#glow-light)"/>
    <circle cx="363" cy="120" r="11" fill="#6FFFE9" filter="url(#glow)"/>
    <circle cx="430" cy="70" r="6" fill="#6FFFE9" filter="url(#glow-light)"/>

    <!-- Distant Stars & Cosmic Dust -->
    <circle cx="80" cy="100" r="2.5" fill="#5BC0BE" opacity="0.8"/>
    <circle cx="150" cy="80" r="1.5" fill="#6FFFE9" opacity="0.6"/>
    <circle cx="420" cy="250" r="3" fill="#5BC0BE" opacity="0.7"/>
    <circle cx="460" cy="350" r="2" fill="#6FFFE9" opacity="0.9"/>
    <circle cx="120" cy="440" r="3" fill="#3A506B" opacity="0.8"/>
    <circle cx="260" cy="450" r="1.5" fill="#5BC0BE" opacity="0.5"/>
    <circle cx="380" cy="400" r="2" fill="#6FFFE9" opacity="0.4"/>
    <circle cx="40" cy="220" r="1.5" fill="#6FFFE9" opacity="0.7"/>
</svg>
